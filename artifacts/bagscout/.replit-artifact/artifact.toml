kind = "web"
previewPath = "/"
title = "BagScout"
version = "1.0.0"
id = "artifacts/bagscout"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21339

[services.development]
run = "pnpm --filter @workspace/bagscout run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bagscout", "run", "build" ]
publicDir = "artifacts/bagscout/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21339"
BASE_PATH = "/"
