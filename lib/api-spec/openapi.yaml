          enum: [exact, strong, close, weak, rejected]
        alertEligible: { type: boolean }
        explanation: { type: string }
        matchReasons:
          type: array
          items: { $ref: "#/components/schemas/MatchReasonItem" }
        disqualifiers:
          type: array
          items: { $ref: "#/components/schemas/DisqualifierItem" }
        preference: { $ref: "#/components/schemas/MatchDebugResolvedPreference" }
