        userId: { type: string }
        nickname: { type: string }
        modelQuery: { type: string, nullable: true }
        minPrice: { type: number, nullable: true }
        maxPrice: { type: number, nullable: true }
        conditionMinName: { type: string, nullable: true }
        conditionMinRank: { type: integer, nullable: true }
