        styles:
          type: array
          items: { type: string }
        colors:
          type: array
          items: { type: string }
        sizes:
          type: array
          items: { type: string }
        colorFamilies:
          type: array
          items: { type: string }

    MatchDebugResolvedListing:
      type: object
      required:
