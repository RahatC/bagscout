        sourceSlug: { type: string }
        sourceUrl: { type: string }
        sourceListingId: { type: string }
        title: { type: string }
        brand: { type: string }
        model: { type: string, nullable: true }
        style: { type: string, nullable: true }
        condition: { type: string, nullable: true }
        color: { type: string, nullable: true }
        size: { type: string, nullable: true }
        normalizedBrand: { type: string }
        normalizedModel: { type: string, nullable: true }
        normalizedStyle: { type: string, nullable: true }
        normalizedCondition: { type: string, nullable: true }
        normalizedColor: { type: string, nullable: true }
        price: { type: number }
        currency: { type: string }
        imageUrl: { type: string, nullable: true }
        availabilityStatus: { type: string }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }

    AdminListingPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminListing" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    AdminPreferenceSummary:
      type: object
      required: [id, userId, nickname, active, alertFrequency]
      properties:
        id: { type: integer }
        userId: { type: string }
        userEmail: { type: string, nullable: true }
        userFullName: { type: string, nullable: true }
        nickname: { type: string }
        active: { type: boolean }
        alertFrequency: { type: string }

    MatchDebugBody:
      type: object
      required: [preferenceId, listingId]
      properties:
        preferenceId: { type: integer, minimum: 1 }
        listingId: { type: integer, minimum: 1 }

    MatchReasonItem:
      type: object
      required: [field, value, matched, weight]
      properties:
        field: { type: string }
        value: { type: string }
        matched: { type: boolean }
        weight: { type: number }
        detail: { type: string, nullable: true }

    DisqualifierItem:
