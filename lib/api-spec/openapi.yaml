    TaxonomyColorBody:
      type: object
      required: [name, family]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        slug: { type: string, minLength: 1, maxLength: 100 }
        family: { type: string, minLength: 1, maxLength: 50 }
