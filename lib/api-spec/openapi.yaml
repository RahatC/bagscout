      required: [field, value, reason]
      properties:
        field: { type: string }
        value: { type: string }
        reason: { type: string }

    MatchDebugResolvedPreference:
      type: object
      required:
        - id
        - nickname
        - userId
        - onlyExactCriteria
        - exactModelEnabled
        - allowCloseMatches
        - allowCloseColorMatch
