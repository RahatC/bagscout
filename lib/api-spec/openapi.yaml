      properties:
        sourceSlug: { type: string }
        listingsFound: { type: integer }
        listingsAdded: { type: integer }
        listingsUpdated: { type: integer }
        durationMs: { type: integer }
        errors:
          type: array
          items: { type: string }

    AdminListing:
      type: object
      required:
        - id
        - sourceId
        - sourceName
        - sourceSlug
        - sourceUrl
        - title
        - brand
        - normalizedBrand
        - price
