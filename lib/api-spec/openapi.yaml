openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: BagScout API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: reference
    description: Reference data — brands, styles, colors, conditions, sizes
  - name: preferences
    description: User bag preferences (dream bag profiles)
  - name: listings
    description: Luxury bag listings
  - name: matches
    description: Match results between preferences and listings
  - name: alerts
    description: User alerts
  - name: saved
    description: Saved listings
  - name: dashboard
  - name: admin
    description: Source health, ingestion logs, manual ingest

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  # ─── Reference data ──────────────────────────────────────────────────────────
  /reference/brands:
    get:
      operationId: listBrands
      tags: [reference]
      responses:
        "200":
          description: Brand list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Brand" }

  /reference/styles:
    get:
      operationId: listStyles
      tags: [reference]
      responses:
        "200":
          description: Bag style list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BagStyle" }

  /reference/colors:
    get:
      operationId: listColors
      tags: [reference]
      responses:
        "200":
          description: Color list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Color" }

  /reference/conditions:
    get:
      operationId: listConditions
      tags: [reference]
      responses:
        "200":
          description: Condition list (ordered by rank)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Condition" }

  /reference/sizes:
    get:
      operationId: listSizes
      tags: [reference]
      responses:
        "200":
          description: Size list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Size" }

  # ─── Bag preferences ─────────────────────────────────────────────────────────
  /preferences:
    get:
      operationId: listBagPreferences
      tags: [preferences]
      responses:
        "200":
          description: List of the authenticated user's bag preferences
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BagPreference" }
    post:
      operationId: createBagPreference
      tags: [preferences]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBagPreferenceBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BagPreference" }

  /preferences/{id}:
    get:
      operationId: getBagPreference
      tags: [preferences]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Preference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BagPreference" }
    patch:
      operationId: updateBagPreference
      tags: [preferences]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBagPreferenceBody" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BagPreference" }
    delete:
      operationId: deleteBagPreference
      tags: [preferences]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /preferences/{id}/suggestions:
    get:
      operationId: getPreferenceSuggestions
      tags: [preferences]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Targeted suggestions to widen a narrow watchlist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreferenceSuggestions" }

  /preferences/{id}/matches:
    get:
      operationId: getPreferenceMatches
      tags: [matches]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Matches for the given preference
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MatchResult" }

  # ─── Listings ────────────────────────────────────────────────────────────────
  /listings:
    get:
      operationId: listListings
      tags: [listings]
      parameters:
        - name: brand
          in: query
          schema: { type: string }
        - name: condition
          in: query
          schema: { type: string }
        - name: color
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: source
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 24 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated listings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingPage" }

  /listings/featured:
    get:
      operationId: getFeaturedListings
      tags: [listings]
      responses:
        "200":
          description: Featured listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Listing" }

  /listings/{id}:
    get:
      operationId: getListing
      tags: [listings]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }

  /listings/{id}/similar-cheaper:
    get:
      operationId: getSimilarCheaperListings
      tags: [listings]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 6 }
      responses:
        "200":
          description: Similar listings priced lower than this one
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Listing" }

  # ─── Matches (cross-preference) ──────────────────────────────────────────────
  /matches:
    get:
      operationId: listMatches
      tags: [matches]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 30 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: All match results across the user's preferences
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MatchResult" }

  # ─── Alerts ──────────────────────────────────────────────────────────────────
  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Alert feed
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Alert" }

  /alerts/{id}/read:
    post:
      operationId: markAlertRead
      tags: [alerts]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated alert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alert" }

  /alerts/read-all:
    post:
      operationId: markAllAlertsRead
      tags: [alerts]
      responses:
        "204":
          description: All marked read

  /alerts/{id}/preview:
    get:
      operationId: getAlertPreview
      tags: [alerts]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Email-ready preview of an alert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertPreview" }

  # ─── Saved ───────────────────────────────────────────────────────────────────
  /saved:
    get:
      operationId: listSavedListings
      tags: [saved]
      responses:
        "200":
          description: Saved listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SavedListing" }
    post:
      operationId: saveListing
      tags: [saved]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveListingBody" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedListing" }

  /saved/{listingId}:
    delete:
      operationId: unsaveListing
      tags: [saved]
      parameters:
        - name: listingId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Removed

  # ─── Dashboard ───────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      responses:
        "200":
          description: Dashboard counters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }

  /dashboard/recent-matches:
    get:
      operationId: getRecentMatches
      tags: [dashboard]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Recent match feed
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MatchResult" }

  /dashboard/price-drops:
    get:
      operationId: getPriceDrops
      tags: [dashboard]
      responses:
        "200":
          description: Listings whose price has dropped
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Listing" }

  # ─── Admin ───────────────────────────────────────────────────────────────────
  /admin/sources:
    get:
      operationId: listSources
      tags: [admin]
      responses:
        "200":
          description: Source health table
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Source" }

  /admin/ingestion-logs:
    get:
      operationId: listIngestionLogs
      tags: [admin]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Recent ingestion log entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IngestionLog" }

  /admin/ingest:
    post:
      operationId: triggerIngest
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TriggerIngestBody" }
      responses:
        "200":
          description: Ingest result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestResult" }

  /admin/digests/run:
    post:
      operationId: runDigests
      tags: [admin]
      description: >-
        Group pending alerts by user and watchlist alertFrequency, mark them
        sent, and return per-frequency counts. Stand-in for a real worker.
      responses:
        "200":
          description: Digest run summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DigestRunResult" }

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    # Reference
    Brand:
      type: object
      required: [id, name, slug, normalizedName]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        normalizedName: { type: string }

    BagStyle:
      type: object
      required: [id, name, slug, normalizedName]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        normalizedName: { type: string }

    Color:
      type: object
      required: [id, name, slug, normalizedName, family]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        normalizedName: { type: string }
        family: { type: string }
        hex: { type: string, nullable: true }

    Condition:
      type: object
      required: [id, name, slug, normalizedName, rank]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        normalizedName: { type: string }
        rank: { type: integer }

    Size:
      type: object
      required: [id, name, slug, normalizedName]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        normalizedName: { type: string }

    # Bag preferences
    BagPreference:
      type: object
      required:
        - id
        - userId
        - nickname
        - exactModelEnabled
        - allowCloseColorMatch
        - onlyExactCriteria
        - allowCloseMatches
        - active
        - alertFrequency
        - brands
        - styles
        - colors
        - sizes
        - matchCount
        - createdAt
        - updatedAt
      properties:
        id: { type: integer }
        userId: { type: string }
        nickname: { type: string }
        exactModelEnabled: { type: boolean }
        modelQuery: { type: string, nullable: true }
        conditionMin: { $ref: "#/components/schemas/Condition", nullable: true }
        allowCloseColorMatch: { type: boolean }
        minPrice: { type: number, nullable: true }
        maxPrice: { type: number, nullable: true }
        onlyExactCriteria: { type: boolean }
        allowCloseMatches: { type: boolean }
        active: { type: boolean }
        alertFrequency:
          type: string
          enum: [realtime, daily, weekly]
        brands:
          type: array
          items: { $ref: "#/components/schemas/Brand" }
        styles:
          type: array
          items: { $ref: "#/components/schemas/BagStyle" }
        colors:
          type: array
          items: { $ref: "#/components/schemas/Color" }
        sizes:
          type: array
          items: { $ref: "#/components/schemas/Size" }
        matchCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateBagPreferenceBody:
      type: object
      required: [nickname, brandIds]
      properties:
        nickname: { type: string, minLength: 1 }
        brandIds:
          type: array
          items: { type: integer }
          minItems: 1
        styleIds:
          type: array
          items: { type: integer }
        colorIds:
          type: array
          items: { type: integer }
        sizeIds:
          type: array
          items: { type: integer }
        exactModelEnabled: { type: boolean }
        modelQuery: { type: string, nullable: true }
        conditionMinId: { type: integer, nullable: true }
        allowCloseColorMatch: { type: boolean }
        minPrice: { type: number, nullable: true }
        maxPrice: { type: number, nullable: true }
        onlyExactCriteria: { type: boolean }
        allowCloseMatches: { type: boolean }
        active: { type: boolean }
        alertFrequency:
          type: string
          enum: [realtime, daily, weekly]

    UpdateBagPreferenceBody:
      type: object
      properties:
        nickname: { type: string }
        brandIds:
          type: array
          items: { type: integer }
        styleIds:
          type: array
          items: { type: integer }
        colorIds:
          type: array
          items: { type: integer }
        sizeIds:
          type: array
          items: { type: integer }
        exactModelEnabled: { type: boolean }
        modelQuery: { type: string, nullable: true }
        conditionMinId: { type: integer, nullable: true }
        allowCloseColorMatch: { type: boolean }
        minPrice: { type: number, nullable: true }
        maxPrice: { type: number, nullable: true }
        onlyExactCriteria: { type: boolean }
        allowCloseMatches: { type: boolean }
        active: { type: boolean }
        alertFrequency:
          type: string
          enum: [realtime, daily, weekly]

    # Listings
    Listing:
      type: object
      required:
        - id
        - sourceId
        - sourceName
        - sourceListingId
        - sourceUrl
        - title
        - brand
        - normalizedBrand
        - price
        - currency
        - availabilityStatus
        - firstSeenAt
        - lastSeenAt
        - createdAt
      properties:
        id: { type: integer }
        sourceId: { type: integer }
        sourceName: { type: string }
        sourceListingId: { type: string }
        sourceUrl: { type: string }
        title: { type: string }
        brand: { type: string }
        model: { type: string, nullable: true }
        style: { type: string, nullable: true }
        condition: { type: string, nullable: true }
        color: { type: string, nullable: true }
        size: { type: string, nullable: true }
        normalizedBrand: { type: string }
        normalizedModel: { type: string, nullable: true }
        normalizedStyle: { type: string, nullable: true }
        normalizedCondition: { type: string, nullable: true }
        normalizedColor: { type: string, nullable: true }
        price: { type: number }
        currency: { type: string }
        originalPrice: { type: number, nullable: true }
        discountPercent: { type: number, nullable: true }
        imageUrl: { type: string, nullable: true }
        description: { type: string, nullable: true }
        availabilityStatus: { type: string }
        # Computed intelligence fields (refreshed every ingest cycle)
        dealScore: { type: number, nullable: true }
        marketLow: { type: number, nullable: true }
        marketMedian: { type: number, nullable: true }
        marketHigh: { type: number, nullable: true }
        marketSampleSize: { type: integer, nullable: true }
        scarcityTier:
          type: string
          nullable: true
          enum: [common, uncommon, rare, very_rare]
        priceVerdict:
          type: string
          nullable: true
          enum: [below, fair, expensive]
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    ListingPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Listing" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    # Match results
    MatchReason:
      type: object
      required: [field, value, matched, weight]
      properties:
        field: { type: string }
        value: { type: string }
        matched: { type: boolean }
        weight: { type: number }
        detail: { type: string, nullable: true }

    Disqualifier:
      type: object
      required: [field, value, reason]
      properties:
        field: { type: string }
        value: { type: string }
        reason: { type: string }

    MatchResult:
      type: object
      required:
        - id
        - userId
        - preferenceId
        - preferenceNickname
        - listing
        - matchScore
        - matchType
        - matchExplanation
        - alertEligible
        - matchReasons
        - disqualifiers
        - createdAt
      properties:
        id: { type: integer }
        userId: { type: string }
        preferenceId: { type: integer }
        preferenceNickname: { type: string }
        listing: { $ref: "#/components/schemas/Listing" }
        matchScore: { type: number }
        matchType: { type: string }
        matchExplanation: { type: string }
        alertEligible: { type: boolean }
        matchReasons:
          type: array
          items: { $ref: "#/components/schemas/MatchReason" }
        disqualifiers:
          type: array
          items: { $ref: "#/components/schemas/Disqualifier" }
        createdAt: { type: string, format: date-time }

    # Alerts
    Alert:
      type: object
      required:
        - id
        - userId
        - preferenceId
        - alertType
        - status
        - createdAt
      properties:
        id: { type: integer }
        userId: { type: string }
        preferenceId: { type: integer }
        preferenceNickname: { type: string, nullable: true }
        listing: { $ref: "#/components/schemas/Listing", nullable: true }
        matchResultId: { type: integer, nullable: true }
        alertType:
          type: string
          enum:
            - new_match
            - price_drop
            - back_in_stock
            - better_condition
            - exact_model
            - under_target_price
        status: { type: string }
        message: { type: string, nullable: true }
        whyNow: { type: string, nullable: true }
        priceAtAlert: { type: number, nullable: true }
        sentAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    AlertPreview:
      type: object
      required:
        - id
        - subject
        - heading
        - whyMatched
        - listing
        - alertType
        - createdAt
      properties:
        id: { type: integer }
        alertType: { type: string }
        subject: { type: string }
        heading: { type: string }
        whyMatched: { type: string }
        whyNow: { type: string, nullable: true }
        matchScore: { type: number, nullable: true }
        matchType: { type: string, nullable: true }
        preferenceNickname: { type: string, nullable: true }
        listing: { $ref: "#/components/schemas/Listing" }
        listingUrl: { type: string }
        viewUrl: { type: string }
        saveUrl: { type: string }
        createdAt: { type: string, format: date-time }

    PreferenceSuggestions:
      type: object
      required: [preferenceId, suggestions]
      properties:
        preferenceId: { type: integer }
        suggestions:
          type: array
          items: { $ref: "#/components/schemas/PreferenceSuggestion" }

    PreferenceSuggestion:
      type: object
      required: [type, title, body]
      properties:
        type:
          type: string
          enum:
            - add_close_colors
            - add_adjacent_sizes
            - raise_max_price
            - include_adjacent_models
        title: { type: string }
        body: { type: string }
        # Optional structured payload (e.g. suggested numeric value, ids).
        suggestedMaxPrice: { type: number, nullable: true }
        suggestedColorIds:
          type: array
          nullable: true
          items: { type: integer }
        suggestedSizeIds:
          type: array
          nullable: true
          items: { type: integer }

    DigestRunResult:
      type: object
      required: [usersNotified, alertsSent, byFrequency]
      properties:
        usersNotified: { type: integer }
        alertsSent: { type: integer }
        byFrequency:
          type: object
          properties:
            realtime: { type: integer }
            daily: { type: integer }
            weekly: { type: integer }

    # Saved listings
    SavedListing:
      type: object
      required: [id, userId, listing, createdAt]
      properties:
        id: { type: integer }
        userId: { type: string }
        listing: { $ref: "#/components/schemas/Listing" }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    SaveListingBody:
      type: object
      required: [listingId]
      properties:
        listingId: { type: integer }
        note: { type: string, nullable: true }

    # Dashboard
    BrandCount:
      type: object
      required: [brand, count]
      properties:
        brand: { type: string }
        count: { type: integer }

    DashboardSummary:
      type: object
      required:
        - preferenceCount
        - activePreferenceCount
        - totalMatchCount
        - newMatchCount
        - unreadAlertCount
        - savedCount
        - topBrands
      properties:
        preferenceCount: { type: integer }
        activePreferenceCount: { type: integer }
        totalMatchCount: { type: integer }
        newMatchCount: { type: integer }
        unreadAlertCount: { type: integer }
        savedCount: { type: integer }
        topBrands:
          type: array
          items: { $ref: "#/components/schemas/BrandCount" }

    # Admin
    Source:
      type: object
      required:
        - id
        - name
        - slug
        - baseUrl
        - sourceType
        - ingestionMode
        - complianceStatus
        - active
        - status
        - listingCount
        - createdAt
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        baseUrl: { type: string }
        sourceType: { type: string }
        ingestionMode: { type: string }
        complianceStatus: { type: string }
        active: { type: boolean }
        lastIngestAt: { type: string, format: date-time, nullable: true }
        listingCount: { type: integer }
        status: { type: string }
        createdAt: { type: string, format: date-time }

    IngestionLog:
      type: object
      required:
        - id
        - sourceId
        - sourceName
        - jobType
        - status
        - recordsSeen
        - recordsCreated
        - recordsUpdated
        - startedAt
      properties:
        id: { type: integer }
        sourceId: { type: integer }
        sourceName: { type: string }
        jobType: { type: string }
        status: { type: string }
        recordsSeen: { type: integer }
        recordsCreated: { type: integer }
        recordsUpdated: { type: integer }
        errorMessage: { type: string, nullable: true }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    TriggerIngestBody:
      type: object
      required: [sourceSlug]
      properties:
        sourceSlug: { type: string }

    IngestResult:
      type: object
      required:
        - sourceSlug
        - listingsFound
        - listingsAdded
        - listingsUpdated
        - durationMs
      properties:
        sourceSlug: { type: string }
        listingsFound: { type: integer }
        listingsAdded: { type: integer }
        listingsUpdated: { type: integer }
        durationMs: { type: integer }
        errors:
          type: array
          items: { type: string }
